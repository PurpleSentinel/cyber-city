version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dev-tooling:
        dependency-type: development
    ignore:
      # typescript-eslint supports typescript <6.1 (docs/DECISIONS.md D18).
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Types track the Node 22 runtime pinned in .nvmrc.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
