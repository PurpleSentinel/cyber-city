name: Release

# On a v* tag, build cybercity natively on amd64 and arm64 (cgo + libpcap) and
# append both to one draft GitHub Release with checksums and SBOMs. The owner
# reviews and publishes the draft. workflow_dispatch runs the same matrix as a
# snapshot dry run without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.18.3
  SYFT_VERSION: v1.54.1

jobs:
  release:
    strategy:
      # One runner at a time: the second appends to the draft the first created.
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install libpcap headers
        run: sudo apt-get update -q && sudo apt-get install -yq libpcap-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build static libpcap (DECISIONS D26)
        run: |
          sudo apt-get install -yq flex bison
          tools/ci/static-libpcap.sh "$RUNNER_TEMP/libpcap" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Binary depends only on glibc
        run: |
          for b in dist/*/cybercity; do
            readelf -d "$b" | grep NEEDED
            if readelf -d "$b" | grep NEEDED | grep -qv -e 'libc.so' -e 'ld-linux'; then
              echo "::error::$b links more than glibc"; exit 1
            fi
          done
