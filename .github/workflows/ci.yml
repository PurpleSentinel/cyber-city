name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap headers
        run: sudo apt-get update -q && sudo apt-get install -yq libpcap-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: go test
        run: go test -race ./...
      - name: govulncheck
        run: govulncheck ./...
      - name: Fixtures are reproducible
        run: make fixtures-check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  # docs/TESTING.md "End-to-end": the built binary replays demo.pcap and
  # Playwright checks the city, shading, inspector, pause and auth.
  e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap headers
        run: sudo apt-get update -q && sudo apt-get install -yq libpcap-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The README's quick start, verbatim (docs/TASKS.md T5.3).
      - name: make setup
        run: make setup
      - name: make build
        run: make build
      - name: README commands
        run: tools/ci/readme-smoke.sh
      - name: Playwright
        run: npx playwright test
        working-directory: web
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            web/e2e/artifacts/
            web/playwright-report/
          if-no-files-found: ignore

  # docs/TESTING.md "Layers": live capture as root, then the privilege drop.
  live-smoke:
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap headers
        run: sudo apt-get update -q && sudo apt-get install -yq libpcap-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Live capture on loopback (root)
        run: |
          go test -c -tags live -o "$RUNNER_TEMP/capture.test" ./internal/capture
          sudo "$RUNNER_TEMP/capture.test" -test.v -test.run Live
      - name: Privilege drop after opening the capture
        run: |
          go build -o bin/cybercity ./cmd/cybercity
          tools/ci/privdrop-smoke.sh bin/cybercity
      - name: README live quick start (make setcap && bin/cybercity)
        run: tools/ci/live-quickstart.sh

  # docs/TASKS.md T5.2: the release config builds, archives and checksums a
  # snapshot. arm64 builds natively in release.yml (cgo + libpcap), so here
  # the amd64 build runs and the arm64 one is skipped.
  release-dry-run:
    needs: [go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install libpcap headers
        run: sudo apt-get update -q && sudo apt-get install -yq libpcap-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build static libpcap (DECISIONS D26)
        run: |
          sudo apt-get install -yq flex bison
          tools/ci/static-libpcap.sh "$RUNNER_TEMP/libpcap" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.54.1
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean
      - name: Snapshot contents
        run: ls -l dist/ && tar tzf dist/cybercity_*_linux_amd64.tar.gz && grep -c . dist/checksums_amd64.txt
      - name: Binary depends only on glibc
        run: |
          for b in dist/*/cybercity; do
            readelf -d "$b" | grep NEEDED
            if readelf -d "$b" | grep NEEDED | grep -qv -e 'libc.so' -e 'ld-linux'; then
              echo "::error::$b links more than glibc"; exit 1
            fi
          done
      # Live capture as root through the static libpcap, then the privilege drop.
      - name: Release binary captures live
        run: tools/ci/privdrop-smoke.sh "$(ls dist/*/cybercity | head -1)"

  # docs/TASKS.md T5.4: throughput and frame time against testdata/perf/
  # baseline.json. Non-blocking: a regression of more than 20% fails the
  # check step and raises an error annotation, but not the workflow.
  perf:
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install libpcap headers
        run: sudo apt-get update -q && sudo apt-get install -yq libpcap-dev
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          name: e2e-artifacts
          path: web/
        continue-on-error: true
      - name: Replay benchmark (no -race)
        run: go test -run XXX -bench BenchmarkReplay -benchtime 10x -count 5 ./internal/pipeline/ | tee bench.txt
      - name: Compare with baseline
        id: compare
        continue-on-error: true
        run: go run ./tools/perfcheck -baseline testdata/perf/baseline.json -bench bench.txt -e2e web/e2e/artifacts/perf.json
      - name: Report regression
        if: steps.compare.outcome == 'failure'
        run: echo "::error title=Performance regression::A metric regressed by more than 20% against testdata/perf/baseline.json (see the job summary)."
